version: "3.9"

services:
  # ── PostgreSQL ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: visionocr
      POSTGRES_PASSWORD: password
      POSTGRES_DB: visionocr_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visionocr"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  # ── FastAPI ─────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://visionocr:password@postgres:5432/visionocr_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./models:/app/models:ro
      - ./datasets:/app/datasets:ro

  # ── Celery Worker ───────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://visionocr:password@postgres:5432/visionocr_db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      REDIS_URL: redis://redis:6379/0
      INFERENCE_BACKEND: ${INFERENCE_BACKEND:-auto}
      BASE_MODEL_ID: ${BASE_MODEL_ID:-Qwen/Qwen2.5-VL-3B-Instruct}
      LORA_ADAPTER_PATH: /app/models/qwen-lora-invoice-adapter-v2
      MERGED_MODEL_PATH: /app/models/qwen-merged-invoice-v2
      AWQ_MODEL_PATH: /app/models/qwen-awq-invoice-v2
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./models:/app/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ── MLflow ─────────────────────────────────────────────────────
  mlflow:
    image: python:3.11-slim
    command: >
      sh -c "pip install mlflow && mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri /mlruns
      --default-artifact-root /mlruns"
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlruns

  # ── Streamlit ───────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "8501:8501"
    environment:
      API_BASE: http://api:8000/api/v1
    depends_on:
      - api

volumes:
  postgres_data:
  mlflow_data:
